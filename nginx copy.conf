worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # ✅ Level 1: The Load Balancer (Upstream)
    upstream logic_proxy_cluster {
        server 127.0.0.1:5000; # Points to our custom logic-proxy.js
    }

    server {
        listen       8080;
        server_name  localhost;

        # ✅ Proxy traffic to the Logic Proxy
        location / {
            proxy_pass http://logic_proxy_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Additional headers for DevOps monitoring
            add_header X-Edge-Proxy "Nginx-Layer-1";
        }

        # Serve static files directly for performance
        location /uploads/ {
            alias c:/Users/sayan/OneDrive/Desktop/aasa/aasa-backend/uploads/;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
