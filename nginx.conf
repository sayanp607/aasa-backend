worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # ✅ Optimization: Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_min_length 1000;

    # ✅ Security: Rate Limiting (10 requests per second)
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    sendfile        on;
    keepalive_timeout  65;

    upstream logic_proxy_cluster {
        server 127.0.0.1:5000;
    }

    server {
        listen       8080;
        server_name  localhost;

        # ✅ Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Edge-Proxy "Nginx-Premium-Edge";

        # ✅ Apply Rate Limiting
        limit_req zone=mylimit burst=20 nodelay;

        location / {
            proxy_pass http://logic_proxy_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Optimized static file serving
        location /uploads/ {
            alias c:/Users/sayan/OneDrive/Desktop/aasa/aasa-backend/uploads/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
